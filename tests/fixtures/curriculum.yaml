            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1301.3781
                title: Mikolov et al., Efficient Estimation of Word Representations in Vector Space (2013)
                note: The Word2Vec paper — this topic's direct subject. The idea that meaning can be learned from
                  co-occurrence at scale, before transformers made it industrial.
          - id: ai-lm-bert
            name: "BERT: Masked Language Modeling"
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-lm-word2vec
            buildsToward:
              - ai-lm-gpt
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1810.04805
                title: "Devlin et al., BERT: Pre-training of Deep Bidirectional Transformers (2018)"
                note: The encoder paradigm's founding paper — masked LM and next-sentence prediction. Read against
                  GPT as the bidirectional-vs-causal contrast.
          - id: ai-lm-gpt
            name: "GPT: Autoregressive Language Modeling"
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-lm-word2vec
            buildsToward:
