              - ai-lm-transfer
            buildsToward: []
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1910.10683
                title: Raffel et al., Exploring the Limits of Transfer Learning with a Unified Text-to-Text
                  Transformer (T5, 2019)
                note: Every task recast as text-in/text-out — the design philosophy in full, plus a systematic
                  ablation of what actually matters in pretraining.
      - id: ai-scaling-modern
        name: Scaling, RLHF, and Modern LLMs
        state: not-started
        currentTopic: null
        prerequisites:
          - ai-lm-pretraining
        bridgeTopics: []
        notes: ""
        coreTopics:
          - id: ai-scale-laws
            name: Scaling Laws
            state: not-started
            lastTouched: null
            prerequisites: []
            buildsToward:
              - ai-scale-emergence
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/2001.08361
                title: Kaplan et al., Scaling Laws for Neural Language Models (2020)
                note: The original power-law scaling paper — loss as a smooth function of size, data, and compute
                  across orders of magnitude.
              - kind: text
                url: https://arxiv.org/abs/2203.15556
                title: Hoffmann et al., Training Compute-Optimal Large Language Models (Chinchilla, 2022)
                note: The correction — most large models were badly undertrained; scale data and parameters
                  together. Read as the direct rebuttal to Kaplan's allocation.
          - id: ai-scale-emergence
            name: Emergent Capabilities
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-scale-laws
            buildsToward:
              - ai-scale-instruction
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/2206.07682
                title: Wei et al., Emergent Abilities of Large Language Models (2022)
                note: The paper that popularized "emergence." Worth pairing with the skeptical reply (Schaeffer's "a
                  mirage?" — emergence as a metric artifact) to run the debate.
          - id: ai-scale-instruction
            name: Instruction Tuning
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-scale-emergence
            buildsToward:
              - ai-scale-rlhf
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/2109.01652
                title: Wei et al., Finetuned Language Models Are Zero-Shot Learners (FLAN, 2021)
                note: Instruction tuning stated cleanly — finetune on many tasks phrased as instructions, generalize
                  to unseen ones. The setup for the RLHF topic next.
          - id: ai-scale-rlhf
            name: RLHF — Reinforcement Learning from Human Feedback
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-scale-instruction
            buildsToward:
              - ai-scale-modern
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/2203.02155
                title: Ouyang et al., Training Language Models to Follow Instructions with Human Feedback
                  (InstructGPT, 2022)
                note: The full RLHF pipeline that produced ChatGPT — SFT, reward model, PPO. The central paper for
                  this topic.
              - kind: text
                url: https://arxiv.org/abs/1706.03741
                title: Christiano et al., Deep Reinforcement Learning from Human Preferences (2017)
                note: Where preference-based RL began — the reward-model-from-comparisons idea, years before it was
                  pointed at language. Good origin story.
          - id: ai-scale-modern
            name: Modern LLMs — Architecture and Training Overview
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-scale-rlhf
            buildsToward: []
            notes: ""
            assets: []
        optionalTopics:
          - id: ai-scale-constitutional
            name: Constitutional AI and RLAIF
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-scale-rlhf
            buildsToward: []
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/2212.08073
                title: "Bai et al., Constitutional AI: Harmlessness from AI Feedback (2022)"
                note: "Anthropic's RLAIF method — a written constitution plus AI-generated critiques replacing much
                  of the human labeling. Directly relevant: it is how Claude-class assistants are
                  trained."
          - id: ai-scale-moe
            name: Mixture of Experts
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-scale-modern
            buildsToward: []
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/2401.04088
                title: Jiang et al., Mixtral of Experts (2024)
                note: A clear, open sparse-MoE report — 8 experts per layer, a router picking 2, 47B params but 13B
                  active. Concrete grounding for the MoE scaling idea.
  - id: sts
    name: Science and Technology Studies (STS) Lane
    weight: 30
    currentUnit: sts-philosophy-science
    nextUp:
      unitId: sts-philosophy-science
      plan: "First lesson: open with the lane roadmap — where this lane is going and how the units fit
        together — then start the first topic."
    direction: A foundational survey of Science and Technology Studies — the canon of ideas and figures
      that shaped the field. Goal is the theoretical vocabulary (names, concepts, key texts) to
      reason about how science and technology shape society, with education as a recurring site of
      analysis.
    units:
      - id: sts-philosophy-science
        name: Philosophy and Sociology of Science
        state: not-started
        currentTopic: null
        prerequisites: []
        bridgeTopics: []
        notes: ""
        coreTopics:
          - id: sts-phil-kuhn
            name: Thomas Kuhn — Paradigm Shifts
            state: not-started
            lastTouched: null
            prerequisites: []
            buildsToward:
              - sts-phil-merton
            notes: ""
            assets:
              - kind: link
                url: https://plato.stanford.edu/entries/thomas-kuhn/
                title: Thomas Kuhn — Stanford Encyclopedia of Philosophy
                note: Authoritative reference on paradigms, normal science, and incommensurability. Structure itself
                  is in copyright, so SEP is the navigational entry point.
          - id: sts-phil-popper
            name: Popper — Falsificationism and Demarcation
            state: not-started
            lastTouched: null
            prerequisites: []
            buildsToward:
              - sts-phil-kuhn
            notes: ""
            assets:
              - kind: link
                url: https://plato.stanford.edu/entries/popper/
                title: Karl Popper — Stanford Encyclopedia of Philosophy
                note: Falsificationism, demarcation, and the critical-rationalist program, with the standard
                  objections. Good scaffold for a fuller standalone pass.
              - kind: link
                url: https://cup.columbia.edu/book/kuhn-vs-popper/9780231134286/
                title: "Steve Fuller, Kuhn vs. Popper: The Struggle for the Soul of Science (2003)"
                note: Fuller reframes the 1965 Popper–Kuhn encounter as a struggle over science's soul — a rich,
                  contrarian source of quotes and framings for the whole Popper/Kuhn thread (Fuller
                  sides with Popper against Kuhn's triumph). Good provocation, not a neutral primer.
          - id: sts-phil-lakatos
            name: Lakatos — Methodology of Scientific Research Programmes
            state: not-started
            lastTouched: null
            prerequisites:
              - sts-phil-kuhn
            buildsToward:
              - sts-phil-feyerabend
            notes: ""
            assets:
              - kind: link
                url: https://plato.stanford.edu/entries/lakatos/
                title: Imre Lakatos — Stanford Encyclopedia of Philosophy
                note: Covers the Methodology of Scientific Research Programmes and has a dedicated section on the
                  Feyerabend/Lakatos debate — a natural hook. The anchor for this topic.
          - id: sts-phil-merton
            name: Merton — Norms of Science
            state: not-started
            lastTouched: null
            prerequisites:
              - sts-phil-kuhn
            buildsToward:
              - sts-phil-ssk
            notes: ""
            assets: []
          - id: sts-phil-ssk
            name: Sociology of Scientific Knowledge (SSK)
            state: not-started
            lastTouched: null
            prerequisites:
              - sts-phil-merton
            buildsToward: []
            notes: ""
            assets:
              - kind: link
                url: https://plato.stanford.edu/entries/scientific-knowledge-social/
                title: The Social Dimensions of Scientific Knowledge — Stanford Encyclopedia of Philosophy
                note: Directly covers Bloor's Strong Programme and the symmetry tenet, situated among the
                  macro-analytic SSK figures (Barnes, Collins, MacKenzie). The anchor for the next
                  lesson.
        optionalTopics:
          - id: sts-phil-feyerabend
            name: Feyerabend — Against Method
            state: not-started
            lastTouched: null
            prerequisites:
              - sts-phil-popper
              - sts-phil-lakatos
            buildsToward: []
            notes: ""
            assets:
              - kind: link
                url: https://plato.stanford.edu/entries/feyerabend/
                title: Paul Feyerabend — Stanford Encyclopedia of Philosophy
                note: Against Method, epistemological anarchism, and "anything goes" — the provocation at the far
                  end of the incommensurability debate.
          - id: sts-phil-fleck
            name: Fleck — Thought Styles and Thought Collectives
            state: not-started
