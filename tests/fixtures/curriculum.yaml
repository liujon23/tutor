# Curriculum Map — structured store (see skills/references/document-formats.md)
# States: topic = not-started | touched | comfortable | shaky
#         unit  = not-started | in-progress | core-complete | complete
# Edit by hand if you like, but run `npm run validate` afterward.

lanes:
  - id: ai
    name: AI Lane
    weight: 50
    currentUnit: ai-nn-foundations
    nextUp:
      topicId: ai-nn-foundations-loss
      plan: "Loss functions and optimization — lead with the log-likelihood framing and a brief softmax
        recap; this topic was touched once already but is still shaky, so it's worth a full pass
        before moving on to embeddings."
    direction: Build from a basic ML/neural-network background up through the key ideas that produced
      modern LLMs — attention, the transformer, pretraining paradigms, scaling laws, and RLHF. Goal
      is genuine understanding of the ideas, not just familiarity with the names.
    units:
      - id: ai-nn-foundations
        name: Neural Network Foundations Refresher
        state: in-progress
        currentTopic: ai-nn-foundations-loss
        prerequisites: []
        bridgeTopics: []
        notes: "Activation functions landed comfortably early on; backpropagation was revisited later
          and confirmed solid. Loss functions and optimization were touched once but aren't solid yet
          — worth a full pass. Keep this unit brisk."
        coreTopics:
          - id: ai-nn-foundations-activation
            name: Activation Functions and Non-Linearity
            state: comfortable
            lastTouched: { date: "2026-06-01", lesson: 1 }
            prerequisites: []
            buildsToward:
              - ai-nn-foundations-backprop
            notes: "Corrected mental model: activations inject non-linearity (the source of
              expressivity), not regularization. Covered the universal-approximation intuition and
              sigmoid/tanh/ReLU gradient tradeoffs."
            assets: []
          - id: ai-nn-foundations-backprop
            name: Backpropagation Refresher
            state: comfortable
            lastTouched: { date: "2026-07-10", lesson: 3 }
            prerequisites:
              - ai-nn-foundations-activation
            buildsToward:
              - ai-nn-foundations-loss
            notes: "Verified solid on a later pass: the delta (the partial derivative of loss with
              respect to a node's activation) is the quantity carried backward; each weight's gradient
              is the incoming delta times the local input; efficiency comes from computing each delta
              once per node and reusing it. The matrix-form backward pass (weight-matrix transpose) is
              deliberately deferred."
            assets: []
          - id: ai-nn-foundations-loss
            name: Loss Functions and Optimization
            state: shaky
            lastTouched: { date: "2026-06-15", lesson: 2 }
            prerequisites:
              - ai-nn-foundations-backprop
            buildsToward:
              - ai-nn-foundations-embeddings
            notes: "Touched briefly: cross-entropy, MSE, SGD, and Adam were introduced but not yet
              consolidated. Revisit with the log-likelihood framing and a short softmax recap."
            assets: []
          - id: ai-nn-foundations-embeddings
            name: Word and Token Embeddings
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-nn-foundations-loss
            buildsToward: []
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1301.3781
                title: Mikolov et al., Efficient Estimation of Word Representations in Vector Space (2013)
                note: The Word2Vec paper — Skip-gram/CBOW and the famous vector arithmetic (king − man + woman ≈
                  queen). The origin of learned dense embeddings.
        optionalTopics:
          - id: ai-nn-foundations-regularization
            name: Regularization Techniques
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-nn-foundations-activation
            buildsToward: []
            notes: ""
            assets: []
      - id: ai-sequence-models
        name: Sequence Modeling
        state: not-started
        currentTopic: null
        prerequisites:
          - ai-nn-foundations
        bridgeTopics: []
        notes: ""
        coreTopics:
