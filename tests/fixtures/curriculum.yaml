            notes: ""
            assets:
              - kind: text
                url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
                title: Radford et al., Language Models are Unsupervised Multitask Learners (GPT-2, 2019)
                note: The decoder paradigm — causal LM at scale, and the claim that next-token prediction alone
                  yields multitask ability zero-shot. OpenAI-hosted PDF.
          - id: ai-lm-transfer
            name: Transfer Learning and Fine-Tuning
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-lm-bert
              - ai-lm-gpt
            buildsToward: []
            notes: ""
