          - id: ai-sequence-models-lstm
            name: LSTMs and GRUs
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-sequence-models-vanishing
            buildsToward:
              - ai-sequence-models-tokenization
            notes: ""
            assets:
              - kind: link
                url: https://colah.github.io/posts/2015-08-Understanding-LSTMs/
                title: Christopher Olah, Understanding LSTM Networks (2015)
                note: The canonical visual explainer — the cell state as a conveyor belt, gates as what's
                  added/removed. Exactly the intuition-first framing this topic wants.
          - id: ai-sequence-models-tokenization
            name: Tokenization
            state: not-started
            lastTouched: null
            prerequisites: []
            buildsToward: []
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1508.07909
                title: Sennrich et al., Neural Machine Translation of Rare Words with Subword Units (2016)
                note: The paper that brought Byte-Pair Encoding to NLP — how subword units solve the open-vocabulary
                  problem. The primary source behind modern tokenizers.
        optionalTopics:
          - id: ai-sequence-models-enc-dec
            name: Encoder-Decoder Architecture (Seq2Seq)
            state: not-started
            lastTouched: null
            prerequisites:
              - ai-sequence-models-lstm
            buildsToward: []
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1409.3215
                title: Sutskever et al., Sequence to Sequence Learning with Neural Networks (2014)
                note: The original encoder–decoder LSTM seq2seq — one fixed vector between the two. Sets up exactly
                  the bottleneck that attention (next unit) was invented to fix.
      - id: ai-attention-transformer
        name: Attention and the Transformer
        state: not-started
        currentTopic: null
        prerequisites:
          - ai-sequence-models
        bridgeTopics: []
        notes: ""
        coreTopics:
          - id: ai-attn-motivation
            name: Why Attention? The Bottleneck Problem
            state: not-started
            lastTouched: null
            prerequisites: []
            buildsToward:
              - ai-attn-mechanism
            notes: ""
            assets:
              - kind: text
                url: https://arxiv.org/abs/1409.0473
                title: Bahdanau et al., Neural Machine Translation by Jointly Learning to Align and Translate (2014)
                note: Where attention was born — the paper that named the fixed-length vector a bottleneck and let
                  the decoder soft-search the source. The motivation, first-hand.
          - id: ai-attn-mechanism
            name: The Attention Mechanism
            state: not-started
            lastTouched: null
            prerequisites:
