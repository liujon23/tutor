                title: "Trevor Pinch, Opening Black Boxes: Science, Technology and Society (1992)"
                note: Pinch's programmatic essay on the black-box metaphor — and the STS obligation to reopen boxes
                  rather than just watch them close. Cases where scientific heroes became villains
                  (Crosse's electric life, Pons–Fleischmann cold fusion). On JSTOR.
