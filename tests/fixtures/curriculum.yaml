                url: https://commons.wikimedia.org/wiki/Special:FilePath/Unique%20Forms%20of%20Continuity%20in%20Space%20MET%20DT6411.jpg
                title: Umberto Boccioni, Unique Forms of Continuity in Space (1913)
                note: Futurism's icon — a striding figure dissolved into speed and force lines. Motion and
                  machine-age dynamism as the whole subject.
              - kind: text
                url: https://en.wikipedia.org/wiki/Manifesto_of_Futurism
                title: F. T. Marinetti, The Manifesto of Futurism (1909)
                note: The primary document — Futurism launched as words before paint. Read the eleven points for the
                  movement's argument (and its glorification of violence).
