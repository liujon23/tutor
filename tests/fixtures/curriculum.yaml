                url: https://www.moma.org/collection/works/79766
                title: Pablo Picasso, Les Demoiselles d'Avignon (1907) — MoMA
                note: The break-open work — flattened space, African-mask faces, the shattered single viewpoint.
                  Still in copyright, so museum page rather than embedded image.
          - id: art-ag-futurism
            name: Futurism and the Machine Age
            state: not-started
            lastTouched: null
            prerequisites:
