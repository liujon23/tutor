  - id: art
    name: Modern Art History Lane
    weight: 20
    currentUnit: art-impressionism
    nextUp:
      unitId: art-impressionism
      plan: "First lesson: open with the lane roadmap — where this lane is going and how the units fit
        together — then start the first topic."
    direction: A survey of major movements and figures from the last ~150 years, focused on building the
      ability to appreciate and interpret work in modern and contemporary museums. The emphasis is
      on what movements were arguing — the discourse — not just visual style. Pre-Impressionism is
      context only.
    units:
      - id: art-impressionism
        name: Impressionism and Post-Impressionism
        state: not-started
        currentTopic: null
        prerequisites: []
        bridgeTopics: []
        notes: ""
        coreTopics:
          - id: art-imp-context
            name: The Academic Tradition and What Impressionism Broke From
            state: not-started
            lastTouched: null
            prerequisites: []
            buildsToward:
              - art-imp-movement
            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/1863%20Alexandre%20Cabanel%20-%20The%20Birth%20of%20Venus.jpg
                title: Alexandre Cabanel, The Birth of Venus (1863)
                note: The Salon ideal Impressionism broke from — smooth finish, mythological subject, idealized
                  nude. Bought by Napoleon III; the establishment taste incarnate.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/William-Adolphe%20Bouguereau%20%281825-1905%29%20-%20Nymphs%20and%20Satyr%20%281873%29%20HQ.jpg
                title: William-Adolphe Bouguereau, Nymphs and Satyr (1873)
                note: Academic technique at its most polished — invisible brushwork, classical subject. The exact
                  surface the Impressionists refused. Good side-by-side foil.
          - id: art-imp-movement
            name: Impressionism — Key Figures, Techniques, and Arguments
            state: not-started
            lastTouched: null
            prerequisites:
              - art-imp-context
            buildsToward:
              - art-imp-post
            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Monet%20-%20Impression%2C%20Sunrise.jpg
                title: Claude Monet, Impression, Sunrise (1872)
                note: The painting that gave the movement its name (mockingly, from a critic). Light and atmosphere
                  over described objects — the whole argument in one canvas.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Auguste%20Renoir%20-%20Dance%20at%20Le%20Moulin%20de%20la%20Galette%20-%20Google%20Art%20Project.jpg
                title: Pierre-Auguste Renoir, Bal du moulin de la Galette (1876)
                note: Dappled sunlight through leaves on a Montmartre crowd — modern Parisian leisure as subject,
                  sensation rendered over line.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Edgar%20Degas%20-%20The%20Ballet%20Class%20-%20Google%20Art%20Project.jpg
                title: Edgar Degas, The Ballet Class (c. 1873–76)
                note: Degas as the movement's odd one out — draftsman, indoor scenes, cropped photographic framing.
                  Useful for showing Impressionism wasn't monolithic.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Berthe%20Morisot%20-%20The%20Cradle%20-%20Google%20Art%20Project.jpg
                title: Berthe Morisot, The Cradle (1872)
                note: A founding Impressionist too often left off the list. Domestic intimacy as a serious subject;
                  loose, feathery handling. Worth foregrounding, not footnoting.
          - id: art-imp-post
            name: Post-Impressionism — Four Diverging Responses
            state: not-started
            lastTouched: null
            prerequisites:
              - art-imp-movement
            buildsToward:
              - art-imp-reading
            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Paul%20Cezanne%20-%20Mont%20Sainte-Victoire%20and%20Ch%C3%A2teau%20Noir%20-%20Google%20Art%20Project.jpg
                title: Paul Cézanne, Mont Sainte-Victoire and Château Noir (c. 1904–06)
                note: Cézanne's argument — structure under sensation, nature reduced to planes and facets. The
                  direct bridge to Cubism.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Van%20Gogh%20-%20Starry%20Night%20-%20Google%20Art%20Project.jpg
                title: Vincent van Gogh, The Starry Night (1889)
                note: Van Gogh's argument — paint as carrier of emotional and spiritual charge. The swirling impasto
                  is expression, not description.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Paul%20Gauguin%20-%20D%27ou%20venons-nous.jpg
                title: Paul Gauguin, Where Do We Come From? What Are We? Where Are We Going? (1897–98)
                note: Gauguin's argument — flat symbolic color, primitivist myth-making, meaning over optical truth.
                  Read right-to-left as a life cycle.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Georges%20Seurat%20-%20A%20Sunday%20on%20La%20Grande%20Jatte%20--%201884%20-%20Google%20Art%20Project.jpg
                title: Georges Seurat, A Sunday on La Grande Jatte (1884)
                note: Seurat's argument — Impressionism systematized into science. Pointillist optical mixing,
                  rigidly composed. Sensation turned into method.
          - id: art-imp-reading
            name: How to Look — Reading a Painting in a Museum
            state: not-started
            lastTouched: null
            prerequisites:
              - art-imp-movement
            buildsToward: []
            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Manet%2C%20Edouard%20-%20Olympia%2C%201863.jpg
                title: Édouard Manet, Olympia (1863)
                note: The ideal close-looking case — a nude that quotes Titian but stares back, flat lighting, a
                  scandalized public. Reads richly for what a painting is *doing* rhetorically.
                  Manet as the hinge between academy and Impressionism.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/%C3%89douard%20Manet%20-%20Le%20D%C3%A9jeuner%20sur%20l%27herbe.jpg
                title: Édouard Manet, Le Déjeuner sur l'herbe (1863)
                note: Salon des Refusés flashpoint. Great for practicing composition and the gap between what's
                  depicted and how — the clothed men, the frank nude, the collapsed depth. Pairs
                  with Olympia to teach reading the break.
        optionalTopics:
          - id: art-imp-symbolism
            name: Symbolism and Other Late 19th-Century Movements
            state: not-started
            lastTouched: null
            prerequisites:
              - art-imp-movement
            buildsToward: []
            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/The%20Kiss%20-%20Gustav%20Klimt%20-%20Google%20Cultural%20Institute.jpg
                title: Gustav Klimt, The Kiss (1907–08)
                note: Vienna Secession Symbolism — gold-leaf ornament, myth and interiority over optical reality.
                  The parallel track running alongside Post-Impressionism.
