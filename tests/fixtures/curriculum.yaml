            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Matisse-Woman-with-a-Hat.jpg
                title: Henri Matisse, Woman with a Hat (1905)
                note: The Salon d'Automne scandal that named the movement. Color torn free of description — a green
                  stripe down a face because the picture, not the face, needs it.
          - id: art-ag-expressionism
            name: German Expressionism
            state: not-started
            lastTouched: null
            prerequisites:
              - art-ag-fauvism
            buildsToward:
              - art-ag-cubism
            notes: ""
            assets:
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Kirchner%20-%20Street%2C%20Dresden%2C%201908%2C%2012.1951.jpg
                title: Ernst Ludwig Kirchner, Street, Dresden (1908, reworked 1919)
                note: Die Brücke wing — jarring color, tilted crowd, alienation of the modern city. Anxiety made
                  visible rather than described.
              - kind: image
                url: https://commons.wikimedia.org/wiki/Special:FilePath/Large%20Blue%20Horses.jpg
                title: Franz Marc, The Large Blue Horses (1911)
                note: Der Blaue Reiter wing — color as spiritual language (blue = the animal, serene, opposed to
                  human corruption). The other pole of Expressionism.
          - id: art-ag-cubism
            name: Cubism — Shattering Perspective
            state: not-started
            lastTouched: null
            prerequisites:
