            state: not-started
            lastTouched: null
            prerequisites:
              - sts-ant-latour-woolgar
            buildsToward:
              - sts-ant-inscriptions
            notes: ""
            assets:
              - kind: link
                url: https://www.degruyter.com/document/doi/10.1525/9780520928251-005/html
                title: Timothy Mitchell, Can the Mosquito Speak? (Rule of Experts, ch. 1, 2002)
                note: The best concrete case for nonhuman agency — the Aswan Dam, malarial mosquitoes, war, and
                  fertilizer in 1940s Egypt, where no clean line separates the natural, the
                  technical, and the social. Extends ANT's symmetry beyond Latour's lab. Publisher
                  page (in copyright).
          - id: sts-ant-inscriptions
            name: Inscriptions, Black Boxes, and Stabilization
            state: not-started
            lastTouched: null
