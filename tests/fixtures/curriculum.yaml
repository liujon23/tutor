              - kind: text
                url: https://monoskop.org/images/3/3d/LeWitt_Sol_1969_1999_Sentences_on_Conceptual_Art.pdf
                title: Sol LeWitt, Sentences on Conceptual Art (1969)
                note: The primary statement — 35 aphorisms ("the idea becomes a machine that makes the art"). Short;
                  read it directly as the movement's own argument.
