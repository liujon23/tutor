            notes: ""
            assets:
              - kind: link
                url: https://jalammar.github.io/illustrated-transformer/
                title: Jay Alammar, The Illustrated Transformer (2018)
                note: The standard visual walkthrough of Q/K/V and scaled dot-product attention. Pairs well with
                  teaching the mechanism precisely from the linear algebra.
