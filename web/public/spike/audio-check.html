<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Audio spike</title>
<link rel="manifest" href="spike.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Spike" />
<link rel="stylesheet" href="audio-check.css?v=3" />
</head>
<body>

<header class="topbar">
  <div class="topline">
    <strong>Audio spike</strong>
    <span id="stamp" class="stamp"></span>
  </div>
  <div id="verdict" class="verdict"></div>
</header>

<!-- The current step. Everything else on the page is reference; this is what
     you act on. Built entirely by audio-check.js. -->
<section id="stage" class="card stage"></section>

<section id="results" class="card results"></section>

<section id="progress" class="card"></section>

<details class="card">
  <summary>Environment</summary>
  <dl id="envlist"></dl>
</details>

<details class="card">
  <summary>Log <span id="count">(0)</span></summary>
  <div class="row">
    <button id="b-copy" class="mini">Copy</button>
    <button id="b-save" class="mini">Download JSON</button>
    <button id="b-reset" class="mini danger">Reset everything</button>
  </div>
  <pre id="log"></pre>
</details>

<script src="audio-check.js?v=3"></script>
</body>
</html>
